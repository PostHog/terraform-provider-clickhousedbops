name: PostHog Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: posthog-release
  queue: max

defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.repository == 'PostHog/terraform-provider-clickhousedbops'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          python3 .github/scripts/test-release-version.py
          go test ./...

      - name: Choose next patch version
        run: |
          previous=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [[ ! $previous =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH release, got: $previous" >&2
            exit 1
          fi
          tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "GORELEASER_PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"

      - name: Build and publish release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ github.token }}
